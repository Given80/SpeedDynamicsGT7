name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build
        run: pyinstaller --noconfirm --clean --onefile --windowed --name SpeedDynamicsGT7 --add-data "web;web" --collect-all Crypto SpeedDynamicsGT7.py
      - uses: actions/upload-artifact@v4
        with:
          name: SpeedDynamicsGT7-Windows
          path: dist/SpeedDynamicsGT7.exe
          if-no-files-found: error
